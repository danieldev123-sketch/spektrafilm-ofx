image: Visual Studio 2022

clone_depth: 1

environment:
  VULKAN_SDK_VERSION: 1.3.290.0

install:
  - choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y
  - choco install ninja -y
  - pip install numpy scipy colour-science
  - choco install vulkan-sdk --version=%VULKAN_SDK_VERSION% -y
  - refreshenv
  - git clone https://github.com/chaert-s/spektrafilm-ofx OFX\SpektraFilm

build_script:
  - cd OFX\SpektraFilm
  - cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release
  - cmake --build build --config Release --parallel

artifacts:
  - path: 'OFX\SpektraFilm\build\Release\**\*.ofx.bundle'
    name: spektrafilm-windows-ofx
  - path: 'OFX\SpektraFilm\build\**\*.zip'
    name: spektrafilm-windows-zip
